name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Lint
        working-directory: backend
        run: uv run ruff check .

      - name: Tests
        working-directory: backend
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: frontend
        run: npm run build

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: predprof-case-2-backend
            dockerfile: backend/Dockerfile
          - image_name: predprof-case-2-frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Normalize registry owner
        id: registry
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image_name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.registry.outputs.owner }}/${{ matrix.image_name }}:${{ github.sha }}
            ghcr.io/${{ steps.registry.outputs.owner }}/${{ matrix.image_name }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-images
    runs-on:
      - self-hosted
      - linux
      - x64
    environment:
      name: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Normalize registry owner
        id: registry
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate deployment secrets
        env:
          APP_HOST: ${{ secrets.APP_HOST }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          for key in APP_HOST JWT_SECRET; do
            if [ -z "${!key}" ]; then
              echo "Missing required secret: $key" >&2
              exit 1
            fi
          done

      - name: Write production env file
        env:
          APP_HOST: ${{ secrets.APP_HOST }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_PORT: ${{ secrets.DB_PORT }}
          JWT_ALGORITHM: ${{ secrets.JWT_ALGORITHM }}
          ACCESS_TOKEN_EXP_MINUTES: ${{ secrets.ACCESS_TOKEN_EXP_MINUTES }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "APP_HOST=${APP_HOST}" \
            "DB_PORT=${DB_PORT:-5432}" \
            "JWT_SECRET=${JWT_SECRET}" \
            "JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}" \
            "ACCESS_TOKEN_EXP_MINUTES=${ACCESS_TOKEN_EXP_MINUTES:-60}" \
            "ROOT_PATH=/api" \
            "BACKEND_IMAGE=ghcr.io/${{ steps.registry.outputs.owner }}/predprof-case-2-backend:${{ github.sha }}" \
            "FRONTEND_IMAGE=ghcr.io/${{ steps.registry.outputs.owner }}/predprof-case-2-frontend:${{ github.sha }}" \
            > .env.prod

      - name: Pull production images
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod pull

      - name: Deploy with Docker Compose
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans

      - name: Show deployed services
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod ps
